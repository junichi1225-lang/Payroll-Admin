  <script type="text/markdown" id="source"># 給与・勤怠管理SaaS 要求分析

複数事業所を持つ企業向けの、マスタ駆動で入力負荷を下げた給与・勤怠管理SaaS。当面の本命は売上1〜5億円規模の中小派遣会社。会計士の監修で、所得税・社会保険・残業代の計算を要件段階で固めている。

> このドキュメントは要求分析のベース。対話で育てていく。空欄や「要確認」は埋めるべき論点を表す。

## 1. アクター・外部システム

| 区分 | 名前 | 役割 |
| --- | --- | --- |
| アクター | 企業管理者 | 企業側の責任者。運用を委ね、締めの結果を確認する |
| アクター | 運用担当者 | マスタ・勤怠・給与・賞与・締めを実際に操作する。企業に雇用された担当者か、委託された士業事務所スタッフ等 |
| アクター | 従業員 | 給与・賞与明細を受け取る。V1では閲覧・受領のみ |
| アクター | 士業（会計士・社労士） | 締め後の一覧を受け取り、複数社を横断して監視する。運用を委託される場合は運用担当者を兼ねる |
| 外部システム | OCRサービス | タイムカード画像から打刻時刻を読み取る |
| 外部システム | 会計ソフト | 給与一覧・仕訳データを取り込む（freee・マネーフォワード等） |
| 外部システム | 共有チャネル | 明細・一覧を届ける（チャットワーク・メール・Web共有リンク） |
| 外部システム | LINEアプリ | 従業員の打刻・画像送信・勤怠確認・承認要求の経路（Messaging API / LIFF） |

- 企業管理者
  - アカウントを持ち、運用担当者に作業を委ねる
  - 雇用するか委託するかを決め、締めの結果を確認する
  - 小規模企業では、企業管理者自身が運用担当者を兼ねることもある
- 運用担当者
  - 事業所マスタに勤務条件（始業終業・休憩・休日・割増の扱い）を設定する
  - 従業員と契約（給与形態・単価）を登録する。同じ画面で入力し、裏で従業員と契約に分けて保持する
  - 料率マスタ（健保・厚年・介護・雇用・支援金）を時点別に維持する
  - 打刻を取り込み（画像・手入力・CSV）、読み取りエラーや打刻忘れを手修正する。手を入れた箇所は色で残る
  - 従業員から要求された勤怠を確認して承認する
  - 個人ごとに給与を試算し、前月との差を見ながら確定し、明細を発行・共有する
  - 賞与は専用の流れ（賞与回の作成→賞与額入力→計算→確定→明細）で扱う
  - 月次を締め、一覧・CSVを出して外部へ渡す
  - 雇用された担当者でも委託された士業事務所スタッフでも、システム上の操作は同じ
- 従業員
  - LINEアプリから打刻する。出退勤の打刻アクション、または自然言語で勤務を伝える
  - LINEアプリからタイムカード画像を送る
  - 自分の勤怠情報を確認し、内容に問題なければ承認を要求する
  - 確定後に発行された明細を、共有リンクまたはPDFで受け取る
- 士業
  - 締め後の全従業員一覧・CSVを受け取る
  - 複数の顧問先を1画面で横断監視する（将来の会計士向けダッシュボード）
  - 運用を委託される場合は、上の運用担当者を兼ねる

外部の情報源として、協会けんぽの都道府県別料率と国税庁の税額表がある。V1ではシステム連携せず、料率・税額表をマスタや定数として取り込む。

未確定の論点:

- 給与の「確定」を承認する役割が、運用担当者と別に企業管理者に要るか。現状は運用担当者自身が確定する前提
- 従業員の勤怠承認要求を受けて、誰が承認するか（運用担当者か企業管理者か）
- 運用を委託される士業と、社外から一覧を受け取るだけの顧問士業を、同じ「士業」アクターでまとめてよいか
- 従業員のLINE連携は、管理者向けWebアプリと通信経路を分けた別構成になる見込み。要求としては一体で捉えるが、実装フェーズは分かれる

## 2. 領域（コンテキスト）

| 領域 | 扱う関心事 | 主なアクター |
| --- | --- | --- |
| 事業所・勤務制度 | 事業所と勤務条件・割増の扱い・所在地。勤怠区分の判定と社保料率の参照キー | 運用担当者 |
| 法定料率 | 健保・厚年・介護・支援金（都道府県別）と雇用（業種別）の料率を時点別に維持 | 運用担当者 |
| 従業員・契約 | 従業員個人と事業所ごとの契約・単価、社保／税の個人別情報 | 運用担当者 |
| 勤怠管理 | 打刻の収集（従業員のLINE打刻・画像、担当者の取込）、5区分への振り分け、例外修正、承認 | 従業員・運用担当者 |
| 月次給与 | 試算・手当設定・確定・明細発行 | 運用担当者 |
| 賞与 | 賞与回の作成から計算・確定・明細まで（月次と別トランザクション） | 運用担当者 |
| 締め・士業連携 | 全従業員の締め、一覧出力、士業への共有 | 運用担当者・士業 |

- 事業所・勤務制度 — 事業所ごとの勤務条件（始業終業・休憩・休日）、割増の扱い（朝残業・深夜・法定／所定休日）、所在地を整える範囲。勤怠の区分判定と、社保料率を引くキーになる
- 法定料率 — 計算に使う法定の率を管理する範囲。健保・介護・厚年・支援金は都道府県別、雇用保険は業種別。いずれも改定に備えて時点別に持つ
- 従業員・契約 — 従業員個人と、事業所ごとの契約・単価を整える範囲。標準報酬月額・住民税額・扶養・保険加入の有無など、個人別の計算前提もここに持つ
- 勤怠管理 — 打刻という「事実」を集める範囲。従業員がLINEで打刻・画像送信し、運用担当者が取り込み・修正・承認する。事業所マスタと突合して基本・残業・朝残業・深夜・休日の5区分へ自動で振り分ける
- 月次給与 — 集計済みの勤怠と各種マスタから総支給・控除・手取りを出し、確定して明細にする範囲
- 賞与 — 月次とは独立したトランザクションとして賞与を扱う範囲。前月の月次給与を参照する
- 締め・士業連携 — 月の給与を締め、外部（会計ソフト・士業）へ渡す範囲

事業所・料率・従業員などの登録は、事前設定画面を強制せず、その場で作って即反映する思想で揃える。

## 3. 業務一覧

各業務に、現実のどんな場面で起きるかを示す「シーン」と、図に表れない具体的な変更内容を示す「変更の詳細」を添える。

### 事業所・勤務制度領域

#### 事業所を登録する

**シーン**: 新しい現場や店舗で稼働を始めるとき、または既存事業所の勤務ルールや所在地が変わったとき。派遣会社が新しい派遣先を増やす場面など。

- 発生するイベント
  - 事業所が登録された
- 変更エンティティ
  - 事業所

**変更の詳細**: 事業所に、始業終業（初期は9:00〜18:00）、休憩（初期60分）、法定休日（例:日曜）と所定休日（例:土曜）、朝残業を含めるか、深夜割増を使うか、所在地の都道府県を持たせる。所在地は健保・介護料率を引くキーになる。丸め方式の設定枠はあるが、現状は未払い賃金を避けるため1分単位固定で動く。

### 法定料率領域

#### 料率を更新する

**シーン**: 年度替わりや法改正で協会けんぽ・雇用保険などの率が変わるとき。たとえば令和8年度の健保・介護・雇用・子ども子育て支援金の改定を、適用月の前に登録しておく。

- 発生するイベント
  - 法定料率が更新された
- 変更エンティティ
  - 法定料率（健保・厚年・介護・支援金）
  - 雇用保険料率

**変更の詳細**: 健保・介護・厚年・支援金は都道府県別、雇用保険は業種別に率を持ち、いずれも適用開始日を付けて対象年月で自動的に切り替える。厚年は全国一律18.30%、支援金は令和8で0.23%など。現状は10都道府県分しか登録されておらず、残りはフォールバック（健保10%）になる課題がある。

### 従業員・契約領域

#### 従業員を登録する

**シーン**: 新しい従業員が入社したとき、または契約条件（単価・勤務先）が変わったとき。派遣スタッフの新規登録や、現場異動にともなう単価変更など。

- 発生するイベント
  - 従業員が登録された
- 参照エンティティ
  - 事業所
- 変更エンティティ
  - 従業員
  - 契約・単価

**変更の詳細**: 従業員に、生年月日（介護保険の40歳判定に使う）、入退社日、所得税区分・扶養親族数、社保／雇用の加入フラグ、標準報酬月額、住民税月額を持たせる。契約には事業所ごとの給与形態（月給／日給／時給）と単価、主たる契約フラグを持つ。画面は1つのフォームでも、裏で従業員と契約に分けて保存する。

```mermaid
flowchart LR
  admin["運用担当者"]:::actor
  cmd["従業員を登録する"]:::command
  evt["従業員が登録された"]:::event
  emp["従業員"]:::entity
  con["契約・単価"]:::entity
  wp["事業所"]:::entity

  admin --> cmd --> evt
  cmd -.参照.-> wp
  evt ==変更==> emp
  evt ==変更==> con

  classDef actor fill:#FFE082,stroke:#F9A825,color:#000

### 勤怠管理領域

#### 従業員が打刻する

**シーン**: 従業員が出勤・退勤のたびにLINEで打刻する。スマホしか持たない現場スタッフが、タイムカードの代わりにLINEで打刻ボタンを押す、または「9時に出勤しました」と自然言語で送る。

- 発生するイベント
  - 打刻された
- 変更エンティティ
  - 日次打刻

**変更の詳細**: 日次打刻に、その日の実打刻時間（始業・終業）が事実として記録される。自然言語の場合はシステムが時刻に変換する。丸めはせず1分単位で残す。どの事業所での打刻かもあわせて持つ。

```mermaid
flowchart LR
  emp["従業員"]:::actor
  line["LINEアプリ"]:::external
  cmd["打刻する"]:::command
  evt["打刻された"]:::event
  tc["日次打刻"]:::entity

  emp --> cmd
  cmd -.経由.-> line
  cmd --> evt
  evt ==変更==> tc

  classDef actor fill:#FFE082,stroke:#F9A825,color:#000
  classDef command fill:#90CAF9,stroke:#1565C0,color:#000
  classDef event fill:#FFB74D,stroke:#EF6C00,color:#000
  classDef entity fill:#FFF59D,stroke:#C9A227,color:#000
  classDef external fill:#C8E6C9,stroke:#2E7D32,color:#000
```

#### タイムカード画像を取り込む

**シーン**: 紙のタイムカードや手書き出勤簿で運用している現場で、月末などにまとめて画像を取り込むとき。従業員がLINEで送る場合と、運用担当者が回収してアップロードする場合がある。

- 発生するイベント
  - 打刻が取り込まれた
  - 読み取りエラーが発生した
- 参照エンティティ
  - 事業所
- 変更エンティティ
  - 日次打刻

**変更の詳細**: OCRが画像から日付ごとの打刻時刻を読み取り、日次打刻に書き込む。読み取れなかった日付の行はエラーとして残り、薄い赤背景・赤枠で示される。事業所の勤務条件を参照し、後段の区分振り分けに備える。

```mermaid

  ope["運用担当者"]:::actor

  ng ==変更==> tc

#### 打刻を手修正する

**シーン**: 退勤の押し忘れ、休憩が取れなかった、OCRが読めなかったなど、事実と記録がずれたとき。チェック者が画面で気づいて直す。

- 発生するイベント
  - 打刻が手修正された
- 変更エンティティ
  - 日次打刻

**変更の詳細**: 運用担当者が日次打刻の時刻や休憩時間を手で上書きする。上書きした行は黄色くハイライトされ、手修正された事実が残る。休憩を0分や30分に減らすと、その分が労働時間として計算される。

#### 勤怠を確認し承認を要求する

**シーン**: 締めの前に、従業員が自分の今月の勤怠をLINEで見て、内容が正しければ承認を求める。運用担当者は要求を受けて中身を確認し、問題なければ承認する。

- 発生するイベント
  - 勤怠の承認が要求された
  - 勤怠が承認された
- 参照エンティティ
  - 日次打刻
- 変更エンティティ
  - 日次打刻

**変更の詳細**: 従業員の承認要求で日次打刻が承認待ちになる。運用担当者の承認で承認済みになり、集計へ進める。差し戻すと記録済みに戻り、再度修正・確認する。

  cmd1 -.参照.-> tc
  cmd1 --> evt1
  evt1 --> cmd2
  ope --> cmd2 --> evt2

#### 労働時間を5区分へ集計する

**シーン**: 打刻が承認されたあと、給与計算の前提として労働時間を集計する。担当者が明示的に操作するというより、確認や試算のたびに裏で走る。

- 発生するイベント
  - 労働時間が集計された
- 参照エンティティ
  - 日次打刻
  - 事業所

**変更の詳細**: 日次打刻と事業所の勤務条件・休日設定を突合し、基本・残業（法定外）・朝残業・深夜・休日（法定／所定）の5区分に振り分ける。事業所ごとに集計するため、複数事業所で働く人は事業所別に時間がまとまる。週40時間・月60時間超の割増を事業所横断で合算するかは論点。

### 月次給与領域

#### 手当を設定する

**シーン**: 役職手当・資格手当・交通費など、その月の手当を登録するとき。毎月固定のものも、その月だけのものもある。

- 発生するイベント
  - 手当が設定された
- 変更エンティティ
  - 手当項目

**変更の詳細**: 手当項目に種類・金額・課税区分を持つ。名称に「通勤」を含むと自動で非課税と判定され、所得税の計算ベースから外れる。任意手当は課税／非課税を手動で切り替えられる。非課税の上限判定は未対応で、現状は全額が非課税になる。

#### 給与を試算する

**シーン**: 締めのあと、確定の前に金額を見ておきたいとき。「前月と同様」ボタンで前月の実績を取り込み、当月との差を見ながら確認する。

- 発生するイベント
  - 給与が試算された
- 参照エンティティ
  - 日次打刻（集計済み）
  - 従業員
  - 契約・単価
  - 手当項目
  - 法定料率
  - 雇用保険料率

**変更の詳細**: 集計済みの勤怠・契約・手当・各種料率から、総支給・社保・税・手取りを計算する。確定はせず何度でも試算し直せる。試算画面と確定画面は同じ計算を使い、金額がずれないようにする。

#### 給与を確定する

**シーン**: 内容を確認し終え、その月の給与を締めて固定するとき。個人ごとに確定する。

- 発生するイベント
  - 給与が確定された
- 参照エンティティ
  - 日次打刻（集計済み）
  - 従業員・契約・手当・各種料率
- 変更エンティティ
  - 月次給与（確定スナップショット）

**変更の詳細**: 月次給与に、その時点の基本給・総実働・支給額・控除額・手取りをスナップショットとして保存し、状態を確定にする。確定後はフォームがグレーアウトしロックされる。翌月にマスタや料率を変えても過去の確定分は再計算されない。賞与源泉のために、社保控除後給与と源泉所得税額もスナップショットへ残す必要があるかは論点。

#### 給与明細を発行・共有する

**シーン**: 確定したあと、従業員に明細を渡すとき。確定済みの人だけ解禁される。

- 発生するイベント
  - 明細が共有された
- 参照エンティティ
  - 月次給与（確定済み）

**変更の詳細**: 月次給与（確定済み）から明細を作り、共有リンクまたはPDFで従業員へ届ける。PDFのファイル名は「[従業員名] 給与明細 [年月].pdf」。明細そのものは確定済みデータの写しで、新たな情報の変更は伴わない。

### 賞与領域

#### 賞与回を作成する

**シーン**: 夏季・冬季賞与など、賞与を支給する回を立ち上げるとき。月次給与とは別に扱う。

- 発生するイベント
  - 賞与回が作成された
- 変更エンティティ
  - 賞与回

**変更の詳細**: 賞与回に支給日と名称を持つ。これを単位に、従業員別の賞与結果がぶら下がる。

#### 賞与を計算する

**シーン**: 賞与回に対して従業員ごとの賞与額を入れ、社保と源泉を計算するとき。

- 発生するイベント
  - 賞与が計算された
- 参照エンティティ
  - 前月の月次給与（社保控除後給与・源泉所得税額）
  - 従業員
  - 法定料率
- 変更エンティティ
  - 賞与結果

**変更の詳細**: 標準賞与額（賞与額の1,000円未満切捨て）を基礎に、健保・介護・厚年・支援金を労使折半で、雇用保険は支給額そのもので計算する。源泉は前月の月次給与（社保控除後）から算出率表を引いて求める。年度累計573万円・1回150万円の上限がある。結果は賞与結果に記録する。

#### 賞与を確定する・明細を出す

**シーン**: 賞与の内容を確認し終え、固定して明細を出すとき。

- 発生するイベント
  - 賞与が確定された
  - 賞与明細が出力された
- 変更エンティティ
  - 賞与結果

**変更の詳細**: 賞与結果を、その時点の料率・金額で固定する。上限到達時は「上限到達によりこの部分は控除されない」旨を明細・画面に出す。前月の月次給与がロック済みであることを確定の前提にするかは論点。

### 締め・士業連携領域

#### 月次給与を締める

**シーン**: 月の給与を全従業員分そろえて締めるとき。未確定の人が残っていないか確認する。

- 発生するイベント
  - 月次給与が締められた
- 参照エンティティ
  - 月次給与

**変更の詳細**: 当月の月次給与を一覧する。未確定の従業員がいれば画面上部に警告ラベルを出す。締め自体は確定済みデータの確認で、金額の変更は伴わない。

#### 士業へ共有する

**シーン**: 締めのあと、会計士・社労士へ給与一覧を渡すとき、または会計ソフトへ取り込むとき。

- 発生するイベント
  - 給与一覧が出力された
  - 士業へ共有された
- 参照エンティティ
  - 月次給与

**変更の詳細**: 月次給与からCSVを出す（ファイル名「[会社名] 給与一覧 [年月].csv」）。会計ソフトへ取り込める形、または士業への共有送信に使う。将来は、部門ごとの人件費配賦や社保の会社／本人負担の内訳まで出せると、士業の月末の手作業が消える。

## 4. 状態モデル

### 日次打刻

```mermaid
stateDiagram-v2
  [*] --> 記録済: 打刻された / 取り込まれた
  記録済 --> 読み取りエラー: 読み取りに失敗した
  読み取りエラー --> 記録済: 手修正された
  記録済 --> 承認待ち: 承認が要求された
  承認待ち --> 記録済: 差し戻された
  承認待ち --> 承認済: 承認された
  承認済 --> 集計対象
  集計対象 --> [*]
```

### 月次給与

```mermaid
stateDiagram-v2
  [*] --> 試算: 試算された
  試算 --> 試算: 再試算された
  試算 --> 確定: 確定された
  確定 --> [*]
```

確定後は、その時点の料率・金額で固定する。翌月にマスタを変えても過去の確定分は書き換わらない。

### 賞与結果

```mermaid
stateDiagram-v2
  [*] --> 賞与額入力: 入力された
  賞与額入力 --> 計算済: 計算された
  計算済 --> 計算済: 再計算された
  計算済 --> 確定: 確定された
  確定 --> [*]
```

## 5. 利用シーン

| シーン | 条件 | 概要 |
| --- | --- | --- |
| 従業員のLINE打刻 | 従業員がLINEを使う | 打刻・画像送信し、自分の勤怠を確認して承認を要求する |
| 通常の月次給与 | 打刻が正常に取り込める | 取込→承認→集計→試算→確定→明細共有が一度で通る |
| 読み取りエラーの修正 | OCRが一部行を読めない | エラー行だけ色付き警告。手入力で消し込む |
| 打刻忘れの修正 | 退勤打刻なし等 | 担当者が時刻を上書き。行が色付きで残る |
| ヘルプ出勤 | 複数事業所・単価違い | 事業所ごとに時間を集計し、別単価で合算する |
| 介護保険の到達 | 40歳到達月 | その月から介護保険料の控除を自動で始める |
| 賞与支給 | 賞与回を作成 | 前月の月次給与を参照して源泉を出す |
| 月途中の入退社 | 入社・退職が月中 | 日割り・退職月の社保。V1未対応 |
| 育休・産休 | 休業中 | 社保免除。V1未対応 |

- 従業員のLINE打刻
  - 従業員がLINEで打刻、または自然言語で勤務を伝える。タイムカード画像を送ることもできる
  - 自分の勤怠を確認し、問題なければ承認を要求する。運用担当者が承認すると集計に進む
- 読み取りエラーの修正
  - エラー行を薄い赤背景・赤枠で示す
  - タップで手入力ビューを開き、時刻を入れるとエラーが解除される
- ヘルプ出勤
  - 「A店舗は時給1,200円、B店舗は1,300円」のように事業所ごとに単価が変わる
  - 打刻場所ごとに労働時間を集計し、それぞれの単価で計算して合算する
  - 週40時間・月60時間超の割増を、事業所をまたいで合算するかは要確認
- 賞与支給
  - 賞与の源泉は前月の月次給与（社保控除後）を参照する
  - 前月が未確定、前職分しかない、賞与額が前月給与の10倍超などのケースの扱いは要確認

## 6. 論点・確認事項

要求として固めきれていない点。会計士・八鍬さんへの確認待ちを含む。

| 論点 | 状態 |
| --- | --- |
| 所定休日労働の一律1.25倍（週40時間以内部分の割増要否） | 会計士確認待ち |
| 残業手当の手入力と勤怠からの自動割増の二重計上をどう防ぐか | 運用方針未定 |
| 雇用保険の事業区分（建設業等の料率差）をマスタに持たせるか | 八鍬確認待ち |
| 住民税の6月と7月以降の月割（特別徴収の初月調整） | 未対応・要否確認 |
| 所得税の扶養人数・乙欄・令和8新設「源泉控除対象親族」の扱い | 未対応 |
| 標準報酬月額の決定（定時決定・随時改定）をマスタ手入力前提でよいか | 要確認 |
| 健保料率の事業所別適用と本社一括適用の切替 | 設計済み・未実装 |
| 通勤手当の非課税上限（公共交通機関 月15万円等）の判定 | 未対応 |
| 複数事業所合算時の週40時間・月60時間超の判定単位 | 要確認 |
| 月途中入退社の日割り、退職月の社保 | V1未対応 |
| 育休・産休中の社保免除 | V1未対応 |
| 賞与の確定は前月月次のロックを必須にするか | 要確認 |

    import { marked } from 'https://cdn.jsdelivr.net/npm/marked@12/lib/marked.esm.js';
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

    async function render() {
      const source = document.getElementById('source').textContent;
      const content = document.getElementById('content');

      if (!source.trim()) {
        content.innerHTML = '<p class="empty">まだ内容がありません。対話を始めてください。</p>';
        return;
      }

      marked.setOptions({ gfm: true, breaks: false });
      content.innerHTML = marked.parse(source);

      const firstHeading = content.querySelector('h1');
      if (firstHeading) document.title = firstHeading.textContent;

      content.querySelectorAll('code.language-mermaid').forEach((code) => {
        const pre = code.parentElement;
        const div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = code.textContent;
        pre.replaceWith(div);
      });

      mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });
      try {
        await mermaid.run({ querySelector: '.mermaid' });
      } catch (e) {
        console.error(e);
      }
    }

    render();

    // dev.mjs の SSE エンドポイントに接続し、index.html の変更時にページ全体をリロードせず差分だけ再描画する
    if (typeof EventSource !== 'undefined' && location.protocol !== 'file:') {
      const es = new EventSource('/events');
      es.onmessage = async (e) => {
        if (e.data !== 'reload') return;
        try {
          const res = await fetch(location.href, { cache: 'no-store' });
          const html = await res.text();
          const doc = new DOMParser().parseFromString(html, 'text/html');
          const newSource = doc.getElementById('source')?.textContent ?? '';
          if (newSource === document.getElementById('source').textContent) return;
          document.getElementById('source').textContent = newSource;
          await render();
        } catch (err) {
          console.error('Live reload failed:', err);
        }
      };
    }
  </script>
